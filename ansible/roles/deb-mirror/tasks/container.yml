---
- name: Create containers config directory
  file:
    path: /etc/containers/containers.conf.d
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Configure podman proxy settings
  template:
    src: containers.conf.j2
    dest: /etc/containers/containers.conf.d/proxy.conf
    mode: '0644'
    owner: root
    group: root
  when:
    - proxy_http is defined or proxy_https is defined or lookup('env', 'HTTP_PROXY') or lookup('env', 'HTTPS_PROXY')

- name: Check if Aptly container exists
  command: podman container exists aptly
  register: aptly_exists
  failed_when: false
  changed_when: false

- name: Stop existing Aptly container
  command: podman stop aptly
  when: aptly_exists.rc == 0
  failed_when: false
  changed_when: true

- name: Remove existing Aptly container
  command: podman rm aptly
  when: aptly_exists.rc == 0
  failed_when: false
  changed_when: true

- name: Create directory for base image
  file:
    path: /opt/container-images
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Copy Debian base image tar
  copy:
    src: debian_13_slim.tar
    dest: /opt/container-images/debian_13_slim.tar
    mode: '0644'
    owner: root
    group: root
  register: debian_tar_copied

- name: Load Debian base image into podman
  command: podman load -i /opt/container-images/debian_13_slim.tar
  when: debian_tar_copied.changed
  register: image_loaded
  changed_when: image_loaded.rc == 0

- name: Tag loaded Debian image
  command: podman tag $(podman images -q --filter "reference=*debian*13*" | head -1) localhost/debian:13-slim
  when: debian_tar_copied.changed or image_loaded.changed
  changed_when: true

- name: Create directory for Dockerfile
  file:
    path: /opt/aptly-build
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Copy Aptly Dockerfile
  copy:
    src: Dockerfile
    dest: /opt/aptly-build/Dockerfile
    mode: '0644'
    owner: root
    group: root
  register: dockerfile_copied

- name: Build Aptly container image
  containers.podman.podman_image:
    name: localhost/aptly
    tag: latest
    path: /opt/aptly-build
    force: "{{ dockerfile_copied.changed }}"
    state: build

- name: Deploy Aptly systemd service
  template:
    src: container-aptly.service.j2
    dest: /etc/systemd/system/container-aptly.service
    mode: '0644'
    owner: root
    group: root
  notify: reload systemd

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start Aptly container service
  systemd:
    name: container-aptly
    enabled: yes
    state: started
  when: not ansible_check_mode
