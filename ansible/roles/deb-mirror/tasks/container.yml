---
- name: Create containers config directory
  file:
    path: /etc/containers/containers.conf.d
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Configure podman proxy settings
  template:
    src: containers.conf.j2
    dest: /etc/containers/containers.conf.d/proxy.conf
    mode: '0644'
    owner: root
    group: root
  when:
    - proxy_http is defined or proxy_https is defined or lookup('env', 'HTTP_PROXY') or lookup('env', 'HTTPS_PROXY')

- name: Check if Aptly container exists
  command: podman container exists aptly
  register: aptly_exists
  failed_when: false
  changed_when: false

- name: Stop existing Aptly container
  command: podman stop aptly
  when: aptly_exists.rc == 0
  failed_when: false
  changed_when: true

- name: Remove existing Aptly container
  command: podman rm aptly
  when: aptly_exists.rc == 0
  failed_when: false
  changed_when: true

- name: Create directory for base image
  file:
    path: /opt/container-images
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Copy Debian base image tar.gz
  copy:
    src: debian_13_slim.tar.gz
    dest: /opt/container-images/debian_13_slim.tar.gz
    mode: '0644'
    owner: root
    group: root
  register: debian_tar_copied

- name: Check if Debian base image exists
  command: podman image exists localhost/debian:13-slim
  register: debian_image_exists
  failed_when: false
  changed_when: false

- name: Load Debian base image into podman
  shell: podman load -i /opt/container-images/debian_13_slim.tar.gz | tee /tmp/podman-load.out
  when: debian_tar_copied.changed or debian_image_exists.rc != 0
  register: image_loaded
  changed_when: image_loaded.rc == 0

- name: Get loaded image name
  shell: "grep -oP 'Loaded image.*: \\K.*' /tmp/podman-load.out || podman images --format '{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}' | grep -E 'debian.*13' | head -1"
  register: loaded_image_name_result
  when: image_loaded.changed
  changed_when: false

- name: Tag loaded Debian image as localhost/debian:13-slim
  command: podman tag "{{ loaded_image_name_result.stdout }}" localhost/debian:13-slim
  when: image_loaded.changed and loaded_image_name_result.stdout is defined and loaded_image_name_result.stdout != ""
  changed_when: true

- name: Create directory for Dockerfile
  file:
    path: /opt/aptly-build
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Copy Aptly Dockerfile
  copy:
    src: Dockerfile
    dest: /opt/aptly-build/Dockerfile
    mode: '0644'
    owner: root
    group: root
  register: dockerfile_copied

- name: Build Aptly container image
  containers.podman.podman_image:
    name: localhost/aptly
    tag: latest
    path: /opt/aptly-build
    force: "{{ dockerfile_copied.changed }}"
    state: build
    build:
      extra_args: >-
        {% if proxy_http is defined %}--build-arg http_proxy={{ proxy_http }} --build-arg https_proxy={{ proxy_https | default(proxy_http) }}{% endif %}
        {% if proxy_no is defined %}--build-arg no_proxy={{ proxy_no }}{% endif %}

- name: Deploy Aptly systemd service
  template:
    src: container-aptly.service.j2
    dest: /etc/systemd/system/container-aptly.service
    mode: '0644'
    owner: root
    group: root
  notify: reload systemd

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start Aptly container service
  systemd:
    name: container-aptly
    enabled: yes
    state: started
  when: not ansible_check_mode
