---
- name: Deploy Repository Mirror Server
  hosts: repo_servers
  become: true

  pre_tasks:
    - name: Validate OS requirements
      assert:
        that:
          - ansible_distribution == "Rocky" or ansible_distribution == "RedHat"
          - ansible_distribution_major_version|int >= 9
        fail_msg: "This playbook requires Rocky Linux 10 (or Rocky/RHEL 9+)"
        success_msg: "OS validation passed: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      tags: always

    - name: Find mount point for repository path
      set_fact:
        repo_mount_path: "{% set target_path = repo_base_path | default('/repos') %}{% set matching = [] %}{% for mount in ansible_mounts %}{% if target_path.startswith(mount.mount) %}{% set _ = matching.append(mount.mount) %}{% endif %}{% endfor %}{{ (matching | sort(reverse=true) | first) | default('/') }}"
      tags: always

    - name: Get mount point details
      set_fact:
        repo_mount_info: "{{ ansible_mounts | selectattr('mount', '==', repo_mount_path) | first }}"
      tags: always

    - name: Calculate available disk space in GB
      set_fact:
        available_space_gb: "{{ (repo_mount_info.size_available / 1024 / 1024 / 1024) | int }}"
      tags: always

    - name: Ensure sufficient disk space
      assert:
        that: available_space_gb | int > 500
        fail_msg: "Insufficient disk space on {{ repo_mount_info.mount }}. Need at least 500GB, found {{ available_space_gb }}GB available"
        success_msg: "Disk space check passed: {{ available_space_gb }}GB available on {{ repo_mount_info.mount }}"
      tags: always

    - name: Display deployment info
      debug:
        msg:
          - "Deploying to: {{ inventory_hostname }} ({{ ansible_host }})"
          - "Repository base path: {{ repo_base_path }}"
          - "Rocky version: {{ repo_rocky_version }}"
          - "Ubuntu release: {{ repo_ubuntu_release }}"
      tags: always

  roles:
    - role: common
      tags: [common]

    - role: repo-storage
      tags: [storage]

    - role: rpm-mirror
      tags: [rpm]

    - role: deb-mirror
      tags: [deb]

    - role: nginx
      tags: [nginx]

    - role: monitoring
      tags: [monitoring]
      when: monitoring_enabled | default(true)

  post_tasks:
    - name: Check which services exist
      stat:
        path: "/etc/systemd/system/{{ item }}.service"
      loop:
        - container-aptly
        - nginx
        - rpm-sync
        - aptly-sync
      register: service_files
      when: not ansible_check_mode
      tags: [validate]

    - name: Validate services are running
      systemd:
        name: "{{ item.item }}"
        state: started
        enabled: yes
      loop: "{{ service_files.results | default([]) }}"
      when:
        - not ansible_check_mode
        - service_files is defined
        - item.stat.exists
        - item.item in ['container-aptly', 'nginx']
      tags: [validate]

    - name: Validate timers are enabled
      systemd:
        name: "{{ item.item }}.timer"
        enabled: yes
      loop: "{{ service_files.results | default([]) }}"
      when:
        - not ansible_check_mode
        - service_files is defined
        - item.stat.exists
        - item.item in ['rpm-sync', 'aptly-sync']
      tags: [validate]

    - name: Display access information
      debug:
        msg:
          - "========================================"
          - "Repository mirror deployed successfully!"
          - "========================================"
          - ""
          - "RPM repos: http://{{ repo_server_hostname }}/rpm/"
          - "DEB repos: http://{{ repo_server_hostname }}/deb/"
          - ""
          - "Health check: http://{{ repo_server_hostname }}/health"
          - "RPM status: http://{{ repo_server_hostname }}/status/rpm"
          - "DEB status: http://{{ repo_server_hostname }}/status/deb"
          - ""
          - "To trigger manual sync:"
          - "  sudo systemctl start rpm-sync.service"
          - "  sudo systemctl start aptly-sync.service"
          - ""
          - "To check sync logs:"
          - "  sudo journalctl -u rpm-sync.service -f"
          - "  sudo journalctl -u aptly-sync.service -f"
      tags: always
