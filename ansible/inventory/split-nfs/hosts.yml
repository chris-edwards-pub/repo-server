---
# Split-Server NFS Inventory
# This inventory is for deploying the repository mirror across two servers:
# - NFS Storage Server (repo-mirror-storage): Provides NFS storage
# - Repository Server (repo-mirror): Serves repositories, mounts NFS

all:
  children:
    # NFS Storage Server
    nfs_servers:
      hosts:
        repo-mirror-storage:
          ansible_host: <STORAGE_SERVER_IP>  # CHANGE THIS - Storage server IP
          ansible_user: ec2-user
          ansible_become: true
          ansible_become_method: sudo
          ansible_python_interpreter: /usr/bin/python3
          # NFS export configuration
          nfs_export_path: /repos
          nfs_client_ip: <REPO_SERVER_IP>    # CHANGE THIS - Repo server IP

    # Repository Server
    repo_servers:
      hosts:
        repo-mirror:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          # NFS mount configuration
          use_nfs_storage: true
          nfs_server: repo-mirror-storage
          nfs_server_ip: <STORAGE_SERVER_IP>  # CHANGE THIS - Storage server IP
          nfs_mount_path: /repos
          nfs_export_path: /repos
